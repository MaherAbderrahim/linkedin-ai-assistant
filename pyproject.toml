[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-ai-assistant"
version = "0.1.0"
description = "Assistant personnel LinkedIn piloté par Telegram — archive centrale SQLite, publication officielle après validations explicites"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1; platform_system == 'Windows'"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
linkedin-assistant = "linkedin_assistant.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linkedin_assistant = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
